name: 🛠️ Build and Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ENABLE_TEST_CI: true
permissions:
  contents: read
jobs:
  format:
    if: (github.repository == 'agentic-ai-java/argi')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
      - run: make tools
      - run: make format-check
  check-style:
    if: (github.repository == 'agentic-ai-java/argi')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
      - run: make tools
      - run: make checkstyle-check
      - name: Check root pom and published BOM version alignment
        run: make bom-consistency-check
  test:
    if: (github.repository == 'agentic-ai-java/argi')
    runs-on: ubuntu-22.04
    needs: [format, check-style]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
      - name: Install ripgrep
        shell: bash
        run: |
          # Use the pinned upstream binary to avoid Ubuntu mirror DNS failures.
          archive="$RUNNER_TEMP/ripgrep-13.0.0-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            --output "$archive" \
            https://github.com/BurntSushi/ripgrep/releases/download/13.0.0/ripgrep-13.0.0-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' ee4e0751ab108b6da4f47c52da187d5177dc371f0f512a7caaec5434e711c091 "$archive" \
            | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" ripgrep-13.0.0-x86_64-unknown-linux-musl/rg
          sudo install -m 0755 "$RUNNER_TEMP/ripgrep-13.0.0-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rg --version
      - run: make tools
      - run: ./mvnw -B install
  build:
    if: (github.repository == 'agentic-ai-java/argi')
    runs-on: ubuntu-22.04
    needs: [format, check-style, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
      - run: corepack enable
      - run: corepack prepare pnpm@10.5.1 --activate
      - run: pnpm --dir argi-studio/agent-chat-ui install --frozen-lockfile
      - run: pnpm --dir argi-studio/agent-chat-ui audit --prod
      - run: pnpm --dir argi-studio/agent-chat-ui run format:check
      - run: pnpm --dir argi-studio/agent-chat-ui run lint
      - run: pnpm --dir argi-studio/agent-chat-ui exec tsc --noEmit
      - run: pnpm --dir argi-studio/agent-chat-ui run test
      - run: pnpm --dir argi-studio/agent-chat-ui run build:static
      - run: make tools
      - name: Build release artifacts without signing or publishing
        run: ./mvnw -B -Prelease -Dgpg.skip=true -DskipTests=true package
      - run: python3 tools/scripts/verify-release-artifacts.py --create-bundle target/central-publishing/central-bundle.zip
      - name: Verify managed BOM versions as an out-of-repo consumer
        run: make bom-consumer-verify
      - name: Verify packaged Studio UI
        shell: bash
        run: |
          studio_jar="$(find argi-studio/target -maxdepth 1 \
            -name 'argi-studio-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$studio_jar"
          jar tf "$studio_jar" | grep -q 'META-INF/resources/chatui/index.html'
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          if-no-files-found: error
          path: |
            .flattened-pom.xml
            argi-*/.flattened-pom.xml
            argi-api/*/.flattened-pom.xml
            argi-spring-boot-starter/*/.flattened-pom.xml
            argi-*/target/*.jar
            argi-api/*/target/*.jar
            argi-spring-boot-starter/*/target/*.jar
          include-hidden-files: true
