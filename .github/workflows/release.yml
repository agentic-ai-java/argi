name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
        default: v2.1.0-RC1
      publish:
        description: Publish to Maven Central and GitHub after signing validation
        required: true
        type: boolean
        default: false
concurrency:
  group: argi-release
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify release tag, version, and draft target
        shell: bash
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          python3 - <<'PY'
          import os
          import subprocess
          import json
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          tag = os.environ['RELEASE_TAG']
          for path in ('pom.xml', 'argi-bom/pom.xml'):
              root = ET.parse(path).getroot()
              assert root.findtext('m:groupId', namespaces=ns) == 'io.github.agentic-ai-java', path
              assert 'v' + root.findtext('m:properties/m:revision', namespaces=ns) == tag, path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          release = json.loads(subprocess.check_output([
              'gh', 'release', 'view', tag, '--repo', os.environ['GITHUB_REPOSITORY'],
              '--json', 'isDraft,targetCommitish'
          ], text=True))
          assert release['isDraft'] and release['targetCommitish'] == sha, 'Release draft target mismatch'
          PY
      - name: Verify release tools
        run: python3 tools/tests/release-tools-test.py
      - name: Check publishing credentials
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"
          test -n "$GPG_PRIVATE_KEY"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Studio UI
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.5.1 --activate
          pnpm --dir argi-studio/agent-chat-ui install --frozen-lockfile
          pnpm --dir argi-studio/agent-chat-ui audit --prod
          pnpm --dir argi-studio/agent-chat-ui run build:static
      - name: Build and sign the release
        run: ./mvnw -B -Prelease -DskipTests=true verify
      - run: python3 tools/scripts/verify-release-artifacts.py --signed --create-bundle target/central-publishing/central-bundle.zip
      - name: Publish to Maven Central
        if: ${{ inputs.publish }}
        run: python3 tools/scripts/publish-central-bundle.py target/central-publishing/central-bundle.zip
      - name: Publish GitHub prerelease after Central succeeds
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
      - name: Archive signed release artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-${{ inputs.tag }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .flattened-pom.xml
            argi-*/.flattened-pom.xml
            argi-api/*/.flattened-pom.xml
            argi-spring-boot-starter/*/.flattened-pom.xml
            target/*.asc
            argi-*/target/*.asc
            argi-api/*/target/*.asc
            argi-spring-boot-starter/*/target/*.asc
            argi-*/target/*.jar
            argi-api/*/target/*.jar
            argi-spring-boot-starter/*/target/*.jar
            target/central-publishing/*.zip
            target/central-publishing/*.json
            argi-bom/target/central-publishing/*.zip
