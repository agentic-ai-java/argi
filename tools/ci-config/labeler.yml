"area/infra":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"
          - "tools/**/*"
          - ".gitignore"
          - "CONTRIBUTING.md"
          - "CONTRIBUTING-zh.md"
"area/docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/README.md"
          - "**/README-zh.md"
          - "**/README-ja.md"
"area/graph":
  - changed-files:
      - any-glob-to-any-file:
          - "argi-graph-core/**/*"
"area/core":
  - changed-files:
      - any-glob-to-any-file:
          - "argi-agent-framework/**/*"
          - "argi-bom/**/*"
          - "argi-api/**/*"
          - "argi-spring-boot-starter/**/*"
"area/studio":
  - changed-files:
      - any-glob-to-any-file:
          - "argi-studio/**/*"
